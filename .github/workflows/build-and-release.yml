name: Build Applications

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: '🍎 iOS — IPA sideloadable (SideStore / AltStore)'
        type: boolean
        default: true
      build_android:
        description: '🤖 Android — APK'
        type: boolean
        default: false
      build_desktop:
        description: '🖥️ Desktop — Windows + macOS + Linux'
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:

  # ── iOS ────────────────────────────────────────────────────────────────────
  #
  # SIGNATURE : deux modes selon les secrets configurés.
  #
  # MODE A — Zéro setup (aucun secret) :
  #   Un certificat auto-signé "Apple Development: CI Build" est généré
  #   à la volée avec OpenSSL. Xamarin.Shared.targets cherche uniquement
  #   ce pattern CN dans le keychain, sans vérifier la chaîne Apple.
  #   codesign accepte n'importe quel cert valide pour code signing.
  #   SideStore re-signe de toute façon à l'installation → ça marche.
  #
  # MODE B — Si le Mode A échoue sur le provisioning profile :
  #   Stocker dans GitHub Secrets (Settings → Secrets → Actions) :
  #     IOS_P12_BASE64   → base64 d'un .p12 exporté depuis ta VM macOS
  #     IOS_P12_PASSWORD → mot de passe du .p12
  #     IOS_PROFILE_B64  → base64 d'un .mobileprovision (Xcode Personal Team)
  #
  #   Procédure sur la VM macOS (une seule fois, ~15 min) :
  #     1. Xcode → Settings → Accounts → ton Apple ID gratuit
  #        → Manage Certificates → + → Apple Development
  #     2. Keychain Access → "Apple Development: ton@email.com"
  #        → Export → certificate.p12 (note le mot de passe)
  #        base64 -i certificate.p12 | pbcopy   → IOS_P12_BASE64
  #     3. Crée un projet iOS vide dans Xcode, signe avec Personal Team.
  #        Xcode génère un .mobileprovision dans :
  #        ~/Library/MobileDevice/Provisioning Profiles/*.mobileprovision
  #        base64 -i ~/Library/MobileDevice/"Provisioning Profiles"/XXXX.mobileprovision | pbcopy
  #        → IOS_PROFILE_B64
  # ──────────────────────────────────────────────────────────────────────────
  build-ios:
    name: 🍎 iOS IPA (sideload)
    runs-on: macos-26
    timeout-minutes: 60
    if: ${{ inputs.build_ios }}

    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install iOS workload (pinné 26.4.x)
        run: |
          for i in 1 2 3; do
            dotnet workload install ios \
              --from-rollback-file .github/workflows/dotnet-ios-rollback.json \
              && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      # Détecte quel mode de signature utiliser (secrets non accessibles dans if:)
      - name: Detect signing mode
        id: signing
        env:
          HAS_P12: ${{ secrets.IOS_P12_BASE64 }}
        run: |
          if [ -n "$HAS_P12" ]; then
            echo "mode=B" >> $GITHUB_OUTPUT
          else
            echo "mode=A" >> $GITHUB_OUTPUT
          fi

      # ── Signing : Mode A (certificat OpenSSL généré en CI) ────────────────
      - name: Setup signing — Mode A (fake cert, aucun secret requis)
        if: steps.signing.outputs.mode == 'A'
        run: |
          KEYCHAIN_PASS=$(uuidgen)
          echo "CI_KEYCHAIN_PASS=$KEYCHAIN_PASS" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain  -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          # CN au format exact attendu par Xamarin.Shared.targets
          cat > /tmp/cert.cnf << 'EOF'
          [ req ]
          default_bits       = 2048
          distinguished_name = dn
          x509_extensions    = ext
          prompt             = no
          [ dn ]
          CN = Apple Development: CI Build (AABBCCDDEE)
          OU = AABBCCDDEE
          O  = Personal Team
          C  = US
          [ ext ]
          basicConstraints = critical, CA:false
          keyUsage         = critical, digitalSignature
          extendedKeyUsage = critical, codeSigning
          EOF

          openssl req -x509 -newkey rsa:2048 -nodes \
            -keyout /tmp/ci_key.pem -out /tmp/ci_cert.pem \
            -days 1 -config /tmp/cert.cnf

          openssl pkcs12 -export -legacy \
            -inkey /tmp/ci_key.pem -in /tmp/ci_cert.pem \
            -out /tmp/ci_cert.p12 -passout pass:ci_temp

          security import /tmp/ci_cert.p12 -k build.keychain \
            -P ci_temp -T /usr/bin/codesign -A
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" build.keychain

          rm -f /tmp/ci_key.pem /tmp/ci_cert.pem /tmp/ci_cert.p12 /tmp/cert.cnf

          CERT=$(security find-identity -v -p codesigning build.keychain \
            | grep "Apple Development" | head -1 | awk -F'"' '{print $2}')
          echo "CI_CERT_NAME=$CERT" >> $GITHUB_ENV
          echo "CI_PROFILE_UUID="  >> $GITHUB_ENV   # vide = pas de profil
          echo "✅ [Mode A] Identité créée : $CERT"

      # ── Signing : Mode B (vrais secrets GitHub) ───────────────────────────
      - name: Setup signing — Mode B (secrets IOS_P12_BASE64)
        if: steps.signing.outputs.mode == 'B'
        env:
          P12_B64:      ${{ secrets.IOS_P12_BASE64 }}
          P12_PASS:     ${{ secrets.IOS_P12_PASSWORD }}
          PROFILE_B64:  ${{ secrets.IOS_PROFILE_B64 }}
        run: |
          KEYCHAIN_PASS=$(uuidgen)
          echo "CI_KEYCHAIN_PASS=$KEYCHAIN_PASS" >> $GITHUB_ENV

          security create-keychain -p "$KEYCHAIN_PASS" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain  -p "$KEYCHAIN_PASS" build.keychain
          security set-keychain-settings -t 3600 -u build.keychain

          echo "$P12_B64" | base64 --decode > /tmp/cert.p12
          security import /tmp/cert.p12 -k build.keychain \
            -P "$P12_PASS" -T /usr/bin/codesign -T /usr/bin/security
          security set-key-partition-list \
            -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASS" build.keychain
          rm /tmp/cert.p12

          CERT=$(security find-identity -v -p codesigning build.keychain \
            | grep -oE '"[^"]+"' | head -1 | tr -d '"')
          echo "CI_CERT_NAME=$CERT" >> $GITHUB_ENV

          if [ -n "$PROFILE_B64" ]; then
            mkdir -p ~/Library/MobileDevice/Provisioning\ Profiles
            echo "$PROFILE_B64" | base64 --decode > /tmp/profile.mobileprovision
            UUID=$(security cms -D -i /tmp/profile.mobileprovision \
              | plutil -extract UUID raw -)
            cp /tmp/profile.mobileprovision \
              ~/Library/MobileDevice/Provisioning\ Profiles/"$UUID".mobileprovision
            rm /tmp/profile.mobileprovision
            echo "CI_PROFILE_UUID=$UUID" >> $GITHUB_ENV
            echo "✅ [Mode B] Cert: $CERT | Profile: $UUID"
          else
            echo "CI_PROFILE_UUID=" >> $GITHUB_ENV
            echo "✅ [Mode B] Cert: $CERT (pas de profile)"
          fi

      - name: Restore dependencies
        run: dotnet restore Platforms/AgValoniaGPS.iOS/AgValoniaGPS.iOS.csproj

      - name: Build iOS (device, ios-arm64)
        run: |
          PROVISION="${{ env.CI_PROFILE_UUID }}"
          dotnet build Platforms/AgValoniaGPS.iOS/AgValoniaGPS.iOS.csproj \
            -c Release \
            -f net10.0-ios \
            -r ios-arm64 \
            /p:CodesignKey="${{ env.CI_CERT_NAME }}" \
            /p:CodesignProvision="$PROVISION" \
            /p:BuildIpa=false

      # Payload trick : identique au workflow Movix de référence
      - name: Package → .ipa
        run: |
          APP=$(find Platforms/AgValoniaGPS.iOS/bin/Release/net10.0-ios/ios-arm64 \
                  -maxdepth 3 -name "*.app" -type d 2>/dev/null | head -1)
          [ -z "$APP" ] && \
            APP=$(find Platforms/AgValoniaGPS.iOS/bin -name "*.app" -type d | head -1)

          if [ -z "$APP" ]; then
            echo "❌ Aucun .app trouvé. Listing :"
            find Platforms/AgValoniaGPS.iOS/bin -maxdepth 6 | head -50
            exit 1
          fi

          echo "✅ .app : $APP"
          mkdir Payload
          cp -r "$APP" Payload/
          zip -r AgValoniaGPS.ipa Payload/
          rm -rf Payload
          echo "📦 IPA — $(du -sh AgValoniaGPS.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgValoniaGPS-iOS
          path: AgValoniaGPS.ipa
          retention-days: 30
          if-no-files-found: error

      - name: Cleanup keychain
        if: always()
        run: security delete-keychain build.keychain || true

  # ── Android ────────────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.build_android }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install Android workload
        run: |
          for i in 1 2 3; do
            dotnet workload install android && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Restore
        run: dotnet restore Platforms/AgValoniaGPS.Android/AgValoniaGPS.Android.csproj

      - name: Decode keystore
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/release.keystore"
            echo "path=$RUNNER_TEMP/release.keystore" >> "$GITHUB_OUTPUT"
            echo "present=true"  >> "$GITHUB_OUTPUT"
            echo "✅ Keystore release chargé."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  Pas de secret keystore → debug key éphémère."
          fi

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ARGS=(publish Platforms/AgValoniaGPS.Android/AgValoniaGPS.Android.csproj
                -c Release -f net10.0-android -o publish/android)
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            ARGS+=(-p:AndroidKeyStore=true
                   "-p:AndroidSigningKeyStore=${{ steps.keystore.outputs.path }}"
                   -p:AndroidSigningKeyAlias=agvalonia
                   -p:AndroidSigningStorePass=env:KS_PASS
                   -p:AndroidSigningKeyPass=env:KS_PASS)
          fi
          dotnet "${ARGS[@]}"

      - name: Rename APK
        run: |
          APK=$(find publish/android -name "*-Signed.apk" | head -1)
          [ -z "$APK" ] && APK=$(find publish/android -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "❌ Aucun APK."; exit 1; fi
          cp "$APK" AgValoniaGPS-Android.apk

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgValoniaGPS-Android
          path: AgValoniaGPS-Android.apk
          retention-days: 30
          if-no-files-found: error

  # ── Desktop ────────────────────────────────────────────────────────────────
  build-desktop:
    name: 🖥️ ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: ${{ inputs.build_desktop }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: Windows-x64
          - os: windows-latest
            rid: win-arm64
            name: Windows-ARM64
          - os: macos-latest
            rid: osx-arm64
            name: macOS-ARM64
          - os: macos-latest
            rid: osx-x64
            name: macOS-x64
          - os: ubuntu-latest
            rid: linux-x64
            name: Linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            name: Linux-ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Restore (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet restore Platforms/AgValoniaGPS.Desktop/AgValoniaGPS.Desktop.csproj \
            -p:DesktopOnly=true

      - name: Restore (Windows / Linux)
        if: runner.os != 'macOS'
        run: dotnet restore Platforms/AgValoniaGPS.Desktop/AgValoniaGPS.Desktop.csproj

      - name: Publish (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet publish Platforms/AgValoniaGPS.Desktop/AgValoniaGPS.Desktop.csproj \
            -c Release -r ${{ matrix.rid }} -f net10.0 \
            -p:DesktopOnly=true --self-contained true \
            -o publish/${{ matrix.name }}

      - name: Publish (Linux)
        if: runner.os == 'Linux'
        run: |
          dotnet publish Platforms/AgValoniaGPS.Desktop/AgValoniaGPS.Desktop.csproj \
            -c Release -r ${{ matrix.rid }} -f net10.0 \
            --self-contained true -o publish/${{ matrix.name }}

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish Platforms/AgValoniaGPS.Desktop/AgValoniaGPS.Desktop.csproj `
            -c Release -r ${{ matrix.rid }} -f net10.0 `
            --self-contained true -o publish/${{ matrix.name }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.name }}/* -DestinationPath AgValoniaGPS-${{ matrix.name }}.zip

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: cd publish && zip -r ../AgValoniaGPS-${{ matrix.name }}.zip ${{ matrix.name }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AgValoniaGPS-${{ matrix.name }}
          path: AgValoniaGPS-${{ matrix.name }}.zip
          retention-days: 30
          if-no-files-found: error
