name: Build Applications

on:
  workflow_dispatch:
    inputs:
      build_ios:
        description: '🍎 iOS — IPA sideloadable (SideStore / AltStore)'
        type: boolean
        default: true
      build_android:
        description: '🤖 Android — APK'
        type: boolean
        default: false
      build_desktop:
        description: '🖥️ Desktop — Windows + macOS + Linux (tous les targets)'
        type: boolean
        default: false

env:
  DOTNET_VERSION: '10.0.x'
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

# ─────────────────────────────────────────────────────────────────────────────
# iOS — IPA non signée pour sideload (SideStore / AltStore / Sideloadly)
#
# Le build cible ios-arm64 (device réel, pas le simulateur).
# La signature est désactivée via les env vars CODE_SIGN_* que dotnet
# transmet en interne à xcodebuild, + les props MSBuild CodesignKey/Provision.
# SideStore re-signe l'IPA avec ton Apple ID au moment de l'installation.
# Durée de validité : 7 jours (Apple ID gratuit) — SideStore renouvelle auto.
# ─────────────────────────────────────────────────────────────────────────────
jobs:
  build-ios:
    name: 🍎 iOS IPA (sideload)
    runs-on: macos-26
    timeout-minutes: 60
    if: ${{ inputs.build_ios }}

    steps:
      - uses: actions/checkout@v4

      # Xcode 26.4.1 est le seul dont la platform iOS est complètement installée
      # sur macos-26 (26.5 beta est présent mais "iOS 26.5 Platform Not Installed").
      # Rollback forward quand Apple shippe Xcode 26.5 GA.
      - name: Select Xcode 26.4.1
        run: sudo xcode-select -s /Applications/Xcode_26.4.1.app

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Install iOS workload (pinné 26.4.x)
        run: |
          for i in 1 2 3; do
            dotnet workload install ios \
              --from-rollback-file .github/workflows/dotnet-ios-rollback.json \
              && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Restore dependencies
        run: dotnet restore Platforms/AgValoniaGPS.iOS/AgValoniaGPS.iOS.csproj

      # Les env vars sont héritées par le xcodebuild appelé en interne par dotnet.
      # /p:BuildIpa=false évite que dotnet tente de créer une IPA signée lui-même.
      - name: Build iOS — device, non signé
        env:
          CODE_SIGN_IDENTITY: ""
          CODE_SIGNING_REQUIRED: "NO"
          CODE_SIGNING_ALLOWED: "NO"
        run: |
          dotnet build Platforms/AgValoniaGPS.iOS/AgValoniaGPS.iOS.csproj \
            -c Release \
            -f net10.0-ios \
            -r ios-arm64 \
            /p:CodesignKey="" \
            /p:CodesignProvision="" \
            /p:BuildIpa=false

      # Pattern identique au workflow Movix : mkdir Payload → cp .app → zip → .ipa
      - name: Package → .ipa
        run: |
          # Chemin attendu en Release ios-arm64
          APP=$(find Platforms/AgValoniaGPS.iOS/bin/Release/net10.0-ios/ios-arm64 \
                  -maxdepth 3 -name "*.app" -type d 2>/dev/null | head -1)
          # Fallback : recherche large si le layout change
          [ -z "$APP" ] && \
            APP=$(find Platforms/AgValoniaGPS.iOS/bin -name "*.app" -type d | head -1)

          if [ -z "$APP" ]; then
            echo "❌ Aucun .app bundle trouvé. Listing du répertoire bin :"
            find Platforms/AgValoniaGPS.iOS/bin -maxdepth 6 | head -50
            exit 1
          fi

          echo "✅ .app trouvé : $APP"
          mkdir Payload
          cp -r "$APP" Payload/
          zip -r AgValoniaGPS.ipa Payload/
          rm -rf Payload
          echo "📦 IPA prête — taille : $(du -sh AgValoniaGPS.ipa | cut -f1)"

      - name: Upload IPA
        uses: actions/upload-artifact@v4
        with:
          name: AgValoniaGPS-iOS
          path: AgValoniaGPS.ipa
          retention-days: 30
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Android — APK signé (ou debug key si pas de secret configuré)
  # ───────────────────────────────────────────────────────────────────────────
  build-android:
    name: 🤖 Android APK
    runs-on: ubuntu-latest
    timeout-minutes: 30
    if: ${{ inputs.build_android }}

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      - name: Setup Java
        uses: actions/setup-java@v4
        with:
          distribution: 'microsoft'
          java-version: '17'

      - name: Install Android workload
        run: |
          for i in 1 2 3; do
            dotnet workload install android && break
            echo "Attempt $i failed, retrying in 10s..."
            sleep 10
          done

      - name: Restore dependencies
        run: dotnet restore Platforms/AgValoniaGPS.Android/AgValoniaGPS.Android.csproj

      - name: Decode keystore de signing
        id: keystore
        env:
          KEYSTORE_B64: ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
        run: |
          if [ -n "$KEYSTORE_B64" ]; then
            echo "$KEYSTORE_B64" | base64 -d > "$RUNNER_TEMP/agvalonia-release.keystore"
            echo "path=$RUNNER_TEMP/agvalonia-release.keystore" >> "$GITHUB_OUTPUT"
            echo "present=true" >> "$GITHUB_OUTPUT"
            echo "✅ Keystore release chargé."
          else
            echo "present=false" >> "$GITHUB_OUTPUT"
            echo "⚠️  Secret ANDROID_KEYSTORE_BASE64 absent — fallback sur la debug key éphémère."
            echo "    L'APK résultant ne pourra pas mettre à jour une installation signée avec une autre clé."
          fi

      - name: Build APK
        env:
          KS_PASS: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
        run: |
          ARGS=(publish Platforms/AgValoniaGPS.Android/AgValoniaGPS.Android.csproj
                -c Release -f net10.0-android -o publish/android)
          if [ "${{ steps.keystore.outputs.present }}" = "true" ]; then
            ARGS+=(-p:AndroidKeyStore=true
                   "-p:AndroidSigningKeyStore=${{ steps.keystore.outputs.path }}"
                   -p:AndroidSigningKeyAlias=agvalonia
                   -p:AndroidSigningStorePass=env:KS_PASS
                   -p:AndroidSigningKeyPass=env:KS_PASS)
          fi
          dotnet "${ARGS[@]}"

      - name: Rename APK
        run: |
          APK=$(find publish/android -name "*-Signed.apk" | head -1)
          [ -z "$APK" ] && APK=$(find publish/android -name "*.apk" | head -1)
          if [ -z "$APK" ]; then echo "❌ Aucun APK trouvé."; exit 1; fi
          cp "$APK" AgValoniaGPS-Android.apk
          echo "✅ APK : $(du -sh AgValoniaGPS-Android.apk | cut -f1)"

      - name: Upload APK
        uses: actions/upload-artifact@v4
        with:
          name: AgValoniaGPS-Android
          path: AgValoniaGPS-Android.apk
          retention-days: 30
          if-no-files-found: error

  # ───────────────────────────────────────────────────────────────────────────
  # Desktop — Windows / macOS / Linux (self-contained, pas de .NET requis)
  # ───────────────────────────────────────────────────────────────────────────
  build-desktop:
    name: 🖥️ ${{ matrix.name }}
    runs-on: ${{ matrix.os }}
    timeout-minutes: 20
    if: ${{ inputs.build_desktop }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: windows-latest
            rid: win-x64
            name: Windows-x64
          - os: windows-latest
            rid: win-arm64
            name: Windows-ARM64
          - os: macos-latest
            rid: osx-arm64
            name: macOS-ARM64
          - os: macos-latest
            rid: osx-x64
            name: macOS-x64
          - os: ubuntu-latest
            rid: linux-x64
            name: Linux-x64
          - os: ubuntu-latest
            rid: linux-arm64
            name: Linux-ARM64

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: ${{ env.DOTNET_VERSION }}

      # macOS multi-target : DesktopOnly=true pour éviter la résolution iOS
      - name: Restore (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet restore Platforms/AgValoniaGPS.Desktop/AgValoniaGPS.Desktop.csproj \
            -p:DesktopOnly=true

      - name: Restore (Windows / Linux)
        if: runner.os != 'macOS'
        run: dotnet restore Platforms/AgValoniaGPS.Desktop/AgValoniaGPS.Desktop.csproj

      - name: Publish (macOS)
        if: runner.os == 'macOS'
        run: |
          dotnet publish Platforms/AgValoniaGPS.Desktop/AgValoniaGPS.Desktop.csproj \
            -c Release -r ${{ matrix.rid }} -f net10.0 \
            -p:DesktopOnly=true --self-contained true \
            -o publish/${{ matrix.name }}

      - name: Publish (Linux)
        if: runner.os == 'Linux'
        run: |
          dotnet publish Platforms/AgValoniaGPS.Desktop/AgValoniaGPS.Desktop.csproj \
            -c Release -r ${{ matrix.rid }} -f net10.0 \
            --self-contained true -o publish/${{ matrix.name }}

      - name: Publish (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: |
          dotnet publish Platforms/AgValoniaGPS.Desktop/AgValoniaGPS.Desktop.csproj `
            -c Release -r ${{ matrix.rid }} -f net10.0 `
            --self-contained true -o publish/${{ matrix.name }}

      - name: Archive (Windows)
        if: runner.os == 'Windows'
        shell: pwsh
        run: Compress-Archive -Path publish/${{ matrix.name }}/* -DestinationPath AgValoniaGPS-${{ matrix.name }}.zip

      - name: Archive (Unix)
        if: runner.os != 'Windows'
        run: cd publish && zip -r ../AgValoniaGPS-${{ matrix.name }}.zip ${{ matrix.name }}

      - name: Upload
        uses: actions/upload-artifact@v4
        with:
          name: AgValoniaGPS-${{ matrix.name }}
          path: AgValoniaGPS-${{ matrix.name }}.zip
          retention-days: 30
          if-no-files-found: error
